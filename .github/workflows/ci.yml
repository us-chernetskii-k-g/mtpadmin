name: MTPADMIN CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble runtime files
        run: |
          cat src/mtpadmin.d/00-core.sh src/mtpadmin.d/10-sources.sh src/mtpadmin.d/20-admin.sh src/mtpadmin.d/21-admin-tail.sh src/mtpadmin.d/22-guard.sh src/mtpadmin.d/25-doctor-runtime.sh src/mtpadmin.d/29-guard-dispatch.sh src/mtpadmin.d/30-menu.sh > /tmp/mtpadmin
          python3 scripts/normalize_cli.py /tmp/mtpadmin

          cat src/stats_collector.d/00-core.py src/stats_collector.d/10-runtime.py > /tmp/stats_collector.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stats_collector.py'); s=p.read_text(); m="if __name__=='__main__': raise SystemExit(main() or 0)"
          e=Path('src/stats_collector.d/15-online-history.py').read_text(); assert s.count(m)==1
          p.write_text(s.replace(m,e.rstrip()+'\n\n'+m,1))
          PY

          cat web/mtpadmin_web.d/00-core.py web/mtpadmin_web.d/10-ui.py web/mtpadmin_web.d/20-pages.py web/mtpadmin_web.d/30-actions.py > /tmp/mtpadmin_web.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/mtpadmin_web.py'); s=p.read_text(); m="if __name__=='__main__': main()"; assert s.count(m)==1
          for f in ('35-world-map.py','36-analytics.py','37-analytics-plus.py','38-operations.py'):
              e=Path('web/mtpadmin_web.d/'+f).read_text(); s=s.replace(m,e.rstrip()+'\n\n'+m,1)
          p.write_text(s)
          PY

      - name: Syntax and final runtime
        run: |
          bash -n /tmp/mtpadmin
          bash -n install.sh
          bash -n update.sh
          bash -n web-install.sh
          bash -n scripts/webproxy_install.sh
          python3 -m py_compile /tmp/stats_collector.py /tmp/mtpadmin_web.py scripts/normalize_cli.py src/user_config.py src/scanner_guard.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/mtpadmin').read_text()
          assert s.count('doctor_cmd(){')==1
          assert s.count('resources_cmd(){')==1
          assert s.count('security_cmd(){')==1
          assert 'Memory PSI healthy' in s and 'Scanner Guard service' in s and 'Web active slot' in s
          assert 'Swap pressure acceptable' not in s
          print('Final CLI PASS')
          PY

      - name: Online history and Guard regression
        run: |
          python3 - <<'PY'
          import importlib.util,sqlite3,tempfile,time
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('collector','/tmp/stats_collector.py'); c=importlib.util.module_from_spec(spec); spec.loader.exec_module(c)
          with tempfile.TemporaryDirectory() as td:
              c.DB=str(Path(td)/'stats.db'); c.SALT_FILE=str(Path(td)/'salt'); con=c.connect(); now=int(time.time()); c._online_last_sample=0
              c._sample_online(con,{'DEIMOS':{'telemt_user_connections_current':4,'telemt_user_unique_ips_current':2}},{('DEIMOS','1.1.1.1'),('DEIMOS','2.2.2.2')},now)
              assert con.execute("SELECT connections,unique_ips FROM online_samples WHERE username='__GLOBAL__'").fetchone()==(4,2)
          spec=importlib.util.spec_from_file_location('guard','src/scanner_guard.py'); g=importlib.util.module_from_spec(spec); spec.loader.exec_module(g)
          assert 'tcp dport 8443' in g.rules(8443,'ci') and 'policy accept' in g.rules(8443,'ci')
          print('Collector/Guard PASS')
          PY

      - name: Operations and WEB Proxy UI
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('web','/tmp/mtpadmin_web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w._o_state=lambda:{'WEBPROXY_HOST':'webproxy.example.com','WEBPROXY_SOURCE':'WEB_PROXY','MTPADMIN_VERSION':'0.11.0'}
          w._o_webproxy_secret=lambda:'00112233445566778899aabbccddeeff'
          link=w._o_webproxy_link()
          assert link=='https://t.me/webproxy?server=webproxy.example.com&secret=00112233445566778899aabbccddeeff'
          assert w._x_compare(5,0,False)[0]=='нет данных для сравнения'
          page=w.page_template('T','body','tester','operations',refresh=10)
          assert 'href="/operations"' in page and page.count('href="/operations"')==1
          assert 'data-live-ms="10000"' in page
          print('Operations/WEB UI PASS')
          PY

      - name: Official WEB Proxy installer invariants
        run: |
          grep -q "TPROXY_COMMIT='52a5feb7fac38f68da5afef9cedd9b3bfc8473ca'" scripts/webproxy_install.sh
          grep -q "TPROXY_REPO='https://github.com/telegramdesktop/tproxy-server.git'" scripts/webproxy_install.sh
          grep -q '"backend":"127.0.0.1:$PORT"' scripts/webproxy_install.sh
          grep -q 'LoadCredential=profiles.json:/etc/tproxy-server/profiles.json' scripts/webproxy_install.sh
          grep -q '127.0.0.1:8081/readyz' scripts/webproxy_install.sh
          grep -q 'BEGIN MTPADMIN WEBPROXY' scripts/webproxy_install.sh
          if grep -qE 'install-mtproxy|mtproto-proxy|-H 2398' scripts/webproxy_install.sh; then
            echo 'Second MTProxy backend must not be installed'; exit 1
          fi

      - name: Seamless updater transformation
        run: |
          grep -q "VERSION='0.11.0'" update.sh
          grep -q '38-operations.py' update.sh
          grep -q 'scripts/webproxy_install.sh' update.sh
          MTPADMIN_BOOTSTRAP_TEST=2 bash update.sh

      - name: Guard against production secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude='ci.yml' '(ee6d61782e727525f37068b87cdc897d|bbd76513a94903a1545f655f8c3625bb|64\.188\.62\.153)' .; then
            echo 'Production value detected in repository'; exit 1
          fi
