name: Installer Interactive

on:
  push:
    paths:
      - install.sh
      - .github/workflows/installer-interactive.yml
  pull_request:
    paths:
      - install.sh
      - .github/workflows/installer-interactive.yml
  workflow_dispatch:

jobs:
  interactive-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and prompt contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          grep -Fq 'ask(){' install.sh
          grep -Fq 'ask_secret(){' install.sh
          grep -Fq 'MTPADMIN_INSTALL_WIZARD_TEST' install.sh
          if grep -Eq '\$\((ask|ask_secret)' install.sh; then
            echo 'Interactive ask must never run inside command substitution.' >&2
            exit 1
          fi

      - name: Downloaded-file style wizard
        shell: bash
        run: |
          set -Eeuo pipefail
          answers() {
            printf '%s\n' \
              'HTTP://Proxy.Example.COM/' \
              '203.0.113.10' \
              '8443' \
              'MAIN' \
              'HTTPS://Google.COM/' \
              '7' \
              '400' \
              '' \
              '' \
              '' \
              'mtpadmin.example.com' \
              'admin' \
              '1234567890x' \
              '1234567890x' \
              'webproxy.example.com'
          }
          answers | script -qefc "sudo env MTPADMIN_RELEASE_REF=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa MTPADMIN_INSTALL_WIZARD_TEST=1 bash ./install.sh" /tmp/installer-file.log
          grep -Fq 'MTProto Proxy:          proxy.example.com:8443' /tmp/installer-file.log
          grep -Fq 'Веб-админка:            https://mtpadmin.example.com/' /tmp/installer-file.log
          grep -Fq 'Telegram WEB Proxy:     https://webproxy.example.com/' /tmp/installer-file.log
          grep -Fq 'Installer interactive wizard test PASS' /tmp/installer-file.log

      - name: Pipe-to-bash wizard
        shell: bash
        run: |
          set -Eeuo pipefail
          answers() {
            printf '%s\n' \
              'proxy.example.com' \
              '203.0.113.10' \
              '8443' \
              'MAIN' \
              'google.com' \
              '7' \
              '400' \
              '' \
              '' \
              '' \
              'mtpadmin.example.com' \
              'admin' \
              '1234567890x' \
              '1234567890x' \
              'webproxy.example.com'
          }
          answers | script -qefc "cat ./install.sh | sudo env MTPADMIN_RELEASE_REF=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb MTPADMIN_INSTALL_WIZARD_TEST=1 bash" /tmp/installer-pipe.log
          grep -Fq 'MTProto Proxy:          proxy.example.com:8443' /tmp/installer-pipe.log
          grep -Fq 'Installer interactive wizard test PASS' /tmp/installer-pipe.log
