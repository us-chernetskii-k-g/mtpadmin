name: MTPADMIN Stability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble audited runtime
        run: |
          set -euo pipefail
          cat src/mtpadmin.d/00-core.sh src/mtpadmin.d/10-sources.sh src/mtpadmin.d/11-source-stability.sh src/mtpadmin.d/20-admin.sh src/mtpadmin.d/21-admin-tail.sh src/mtpadmin.d/22-guard.sh src/mtpadmin.d/25-doctor-runtime.sh src/mtpadmin.d/29-guard-dispatch.sh src/mtpadmin.d/30-menu.sh > /tmp/mtpadmin
          python3 scripts/normalize_cli.py /tmp/mtpadmin
          cat src/stats_collector.d/00-core.py src/stats_collector.d/10-runtime.py > /tmp/stats.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stats.py'); s=p.read_text(); m="if __name__=='__main__': raise SystemExit(main() or 0)"
          e=Path('src/stats_collector.d/15-online-history.py').read_text(); assert s.count(m)==1
          p.write_text(s.replace(m,e.rstrip()+'\n\n'+m,1))
          p=Path('/tmp/web.py'); s=''.join(Path('web/mtpadmin_web.d/'+x).read_text() for x in ('00-core.py','10-ui.py','20-pages.py','30-actions.py'))
          m="if __name__=='__main__': main()"; assert s.count(m)==1
          for x in ('35-world-map.py','36-analytics.py','37-analytics-plus.py','38-operations.py','39-compact-ui.py','40-async-update-ui.py','41-webproxy-links-ui.py','42-stability.py','43-db-safety.py','44-webproxy-activity.py'):
              e=Path('web/mtpadmin_web.d/'+x).read_text(); s=s.replace(m,e.rstrip()+'\n\n'+m,1)
          p.write_text(s)
          PY

      - name: Syntax
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.11.12'
          grep -q "VERSION='0.11.12'" update.sh
          grep -q "VERSION='0.11.12'" web-install.sh
          bash -n /tmp/mtpadmin
          bash -n update.sh
          bash -n web-install.sh
          bash -n scripts/webproxy_install.sh
          bash -n scripts/webproxy_backend_install.sh
          bash -n scripts/webproxy_telemetry_install.sh
          bash -n scripts/component_update.sh
          bash -n scripts/scanner_watchdog.sh
          python3 -m py_compile /tmp/web.py /tmp/stats.py src/user_config.py src/scanner_guard.py scripts/update_check.py

      - name: Update Center form isolation regression
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w._o_update_status=lambda:{'components':{k:{'current':'1','latest':'2','available':k=='mtpadmin'} for k in ('mtpadmin','telemt','webproxy')},'checked_at':1,'updates':1}
          w._o_component_status=lambda:{}
          html=w._o_update_center('csrf')
          assert "type='hidden' name='component'" not in html
          for comp in ('mtpadmin','telemt','webproxy'):
              assert f"name='component' value='{comp}'" in html
          doc=w.page_template('x','<form><input type="hidden" name="name" value="A"><input name="q" value="x"></form>','admin')
          assert doc.count('input:not([type=hidden])')>=2
          assert "root.querySelectorAll('input,select,textarea')" not in doc
          print('Update Center form isolation PASS')
          PY

      - name: SQLite FD regression
        run: |
          python3 - <<'PY'
          import importlib.util,os,sqlite3,tempfile
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          fd,path=tempfile.mkstemp(); os.close(fd)
          c=sqlite3.connect(path); c.execute('create table t(x integer)'); c.execute('insert into t values(1)'); c.commit(); c.close()
          w.DB=path
          before=len(os.listdir('/proc/self/fd'))
          for _ in range(500): assert w.scalar('select x from t')==1
          after=len(os.listdir('/proc/self/fd'))
          assert after-before<=3,(before,after)
          print('FD regression PASS',before,after)
          PY

      - name: Source editor and TOML boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,tempfile,tomllib
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('u','src/user_config.py'); u=importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          p=Path(tempfile.mktemp(suffix='.toml')); p.write_text('[access.users]\n"DEMO"="00112233445566778899aabbccddeeff"\n\n[[upstreams]]\ntype="direct"\nenabled=true\nweight=10\n')
          u.CFG=p
          class A: pass
          a=A(); a.name='DEMO'; a.ad_tag='ffeeddccbbaa99887766554433221100'; a.max_conns='123'; a.max_ips='7'; u.edit(a)
          a.ad_tag='none'; a.max_conns='none'; a.max_ips='none'; u.edit(a)
          b=A(); b.name='AD_01'; b.secret='11'*16; b.ad_tag=None; b.max_conns=None; b.max_ips=None; u.add(b)
          with open(p,'rb') as f:d=tomllib.load(f)
          assert d['access']['users']['AD_01']==b.secret and 'AD_01' not in d['upstreams'][0]
          p.write_text('[access.users]\n"MAIN"="00112233445566778899aabbccddeeff"\n\n[[upstreams]]\ntype="direct"\n"WEB_PROXY"="22222222222222222222222222222222"\n')
          u.CFG=p; u.repair_misplaced(A())
          with open(p,'rb') as f:d=tomllib.load(f)
          assert d['access']['users']['WEB_PROXY']=='22222222222222222222222222222222' and 'WEB_PROXY' not in d['upstreams'][0]
          print('Source/TOML regression PASS')
          PY

      - name: Config runtime and WEB client merge
        run: |
          python3 - <<'PY'
          import importlib.util,tempfile
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          p=Path(tempfile.mktemp(suffix='.toml')); p.write_text('[access.users]\n"A"="00112233445566778899aabbccddeeff"\n"B"="ffeeddccbbaa99887766554433221100"\n"WEB_PROXY"="11111111111111111111111111111111"\n')
          w.CFG=str(p); w.state=lambda:{'PROFILE':'A','WEBPROXY_SOURCE':'WEB_PROXY'}
          w.api_json=lambda path,**kw: ([{'username':'A','enabled':True,'in_runtime':True,'current_connections':4,'active_unique_ips':1},{'username':'WEB_PROXY','enabled':True,'in_runtime':True,'current_connections':0,'active_unique_ips':0}] if path=='/v1/users' else ([{'username':'A','active_ips':['203.0.113.7']}] if path=='/v1/stats/users/active-ips' else {}))
          w._wpa_metrics=lambda:{'tproxy_sessions_live':3,'tproxy_streams_live':8,'tproxy_streams_opened_total':24,'tproxy_bytes_up_total':100,'tproxy_bytes_down_total':200,'tproxy_backend_dial_failures_total':0,'tproxy_limit_hits_total':0}
          w._wpa_clients=lambda:[{'ip':'198.51.100.10','sessions':2},{'ip':'2001:db8::10','sessions':1}]
          w.query=lambda *a,**kw: []
          rows={x['username']:x for x in w.source_rows()}
          assert rows['A']['in_runtime'] is True and rows['B']['config_present'] is True and rows['B']['in_runtime'] is False
          assert rows['WEB_PROXY']['current_connections']==3 and rows['WEB_PROXY']['active_unique_ips']==2 and rows['WEB_PROXY']['web_streams_live']==8
          html=w.sources_html('tester','csrf'); assert 'CONFIG ONLY' in html and 'Настроить' in html
          active=w.active_clients_html(); assert '198.51.100.10' in active and '2001:db8::10' in active and '203.0.113.7' in active and '● WEB' in active
          print('Config/runtime/WEB client merge PASS')
          PY

      - name: WEB collector active IP and history contract
        run: |
          python3 - <<'PY'
          import importlib.util,sqlite3
          spec=importlib.util.spec_from_file_location('s','/tmp/stats.py'); s=importlib.util.module_from_spec(spec); spec.loader.exec_module(s)
          s.state=lambda:{'WEBPROXY_SOURCE':'WEB_PROXY'}
          s._base_active_pairs=lambda:{('DEIMOS','203.0.113.7')}
          s._tproxy_client_rows=lambda:[{'ip':'198.51.100.10','sessions':2},{'ip':'2001:db8::10','sessions':1}]
          active=s.active_pairs(); assert len(active)==3
          assert ('WEB_PROXY','198.51.100.10') in active and ('WEB_PROXY','2001:db8::10') in active
          con=sqlite3.connect(':memory:')
          con.executescript('''CREATE TABLE online_samples(ts INTEGER,username TEXT,connections INTEGER,unique_ips INTEGER,PRIMARY KEY(ts,username));
          CREATE TABLE daily_traffic(day TEXT,username TEXT,connections INTEGER DEFAULT 0,bad_connections INTEGER DEFAULT 0,bytes_from_client INTEGER DEFAULT 0,bytes_to_client INTEGER DEFAULT 0,peak_connections INTEGER DEFAULT 0,peak_unique_ips INTEGER DEFAULT 0,PRIMARY KEY(day,username));
          CREATE TABLE counter_state(username TEXT PRIMARY KEY,conn_total INTEGER DEFAULT 0,bad_total INTEGER DEFAULT 0,bytes_from INTEGER DEFAULT 0,bytes_to INTEGER DEFAULT 0,updated_at INTEGER DEFAULT 0);''')
          s._online_last_sample=0
          s._sample_online(con,{'DEIMOS':{'telemt_user_connections_current':4,'telemt_user_unique_ips_current':1}},active,60,{'tproxy_sessions_live':3},'WEB_PROXY')
          assert con.execute("select connections,unique_ips from online_samples where username='WEB_PROXY'").fetchone()==(3,2)
          assert con.execute("select connections,unique_ips from online_samples where username='__GLOBAL__'").fetchone()==(7,3)
          s._sample_web_traffic(con,{'tproxy_sessions_created_total':10,'tproxy_sessions_live':2,'tproxy_bytes_up_total':1000,'tproxy_bytes_down_total':2000},'WEB_PROXY',60,2)
          s._sample_web_traffic(con,{'tproxy_sessions_created_total':12,'tproxy_sessions_live':3,'tproxy_bytes_up_total':1100,'tproxy_bytes_down_total':2300},'WEB_PROXY',70,2)
          assert con.execute("select connections,bytes_from_client,bytes_to_client,peak_connections,peak_unique_ips from daily_traffic where username='WEB_PROXY'").fetchone()==(2,100,300,3,2)
          print('WEB active/history PASS')
          PY

      - name: Source apply fallback contract
        run: |
          set -euo pipefail
          grep -q '_st_restart_telemt()' web/mtpadmin_web.d/42-stability.py
          grep -q 'Runtime TeleMT не подтвердил изменение источника' web/mtpadmin_web.d/42-stability.py
          grep -q 'shutil.copy2(backup,CFG)' web/mtpadmin_web.d/42-stability.py
          grep -q 'source_apply_or_restart' src/mtpadmin.d/11-source-stability.sh
          grep -q 'source_full_restart' src/mtpadmin.d/11-source-stability.sh

      - name: WEB telemetry and production contracts
        run: |
          set -euo pipefail
          grep -q '"max_pending_items_per_session": 16384' scripts/webproxy_install.sh
          grep -q 'chmod 0711 "$TMP"' scripts/webproxy_backend_install.sh
          grep -q 'chmod 0755 "$build/objs/bin/mtproto-proxy"' scripts/webproxy_backend_install.sh
          grep -q 'RestrictAddressFamilies=AF_INET AF_INET6 AF_NETLINK' scripts/webproxy_backend_install.sh
          grep -q 'PATCH_LEVEL=' scripts/webproxy_telemetry_install.sh
          grep -q '/mtpadmin/clients' scripts/webproxy_telemetry_install.sh
          grep -q 'sessionsPerIP' scripts/webproxy_telemetry_install.sh
          grep -q "WEBTELEMETRY='/usr/local/lib/mtpadmin/webproxy_telemetry_install.sh'" scripts/component_update.sh
          grep -q 'bash "$WEBTELEMETRY"' scripts/component_update.sh
          grep -q '_TPROXY_CLIENTS' src/stats_collector.d/15-online-history.py
          grep -q '_WPA_CLIENTS_URL' web/mtpadmin_web.d/44-webproxy-activity.py
          grep -q "name='component' value='" web/mtpadmin_web.d/40-async-update-ui.py
          ! grep -q "type='hidden' name='component'" web/mtpadmin_web.d/40-async-update-ui.py

      - name: Scanner Guard self-heal contract
        run: |
          set -euo pipefail
          grep -q 'MAX_AGE=.*120' scripts/scanner_watchdog.sh
          grep -q 'systemctl restart "$SCANNER"' scripts/scanner_watchdog.sh
          grep -q 'systemctl is-active --quiet "$TELEMT"' scripts/scanner_watchdog.sh

      - name: Product and support contract
        run: |
          set -euo pipefail
          grep -q 'https://t.me/boss_of_this_vpn' README.md
          grep -q 'https://yookassa.ru/my/i/aoLKJEpmtnnX/l' README.md
          grep -q 'https://t.me/boss_of_this_vpn' scripts/webproxy_install.sh

      - name: Guard against accidental production secrets
        run: |
          python3 - <<'PY'
          import pathlib,re
          allowed={'00112233445566778899aabbccddeeff','ffeeddccbbaa99887766554433221100','11111111111111111111111111111111','22222222222222222222222222222222','33333333333333333333333333333333'}
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.zip','.gz','.db'}: continue
              try:s=p.read_text(errors='ignore')
              except Exception:continue
              for m in re.finditer(r'(?i)(?:secret|password|token)\s*[=:]\s*["\x27]?([0-9a-f]{32,}|[A-Za-z0-9_-]{40,})',s):
                  value=m.group(1)
                  if value.lower() not in allowed: bad.append((str(p),value[:12]))
          assert not bad,bad
          print('Secret scan PASS')
          PY
