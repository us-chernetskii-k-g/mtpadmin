name: MTPADMIN CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble runtime files
        run: |
          cat src/mtpadmin.d/00-core.sh src/mtpadmin.d/10-sources.sh src/mtpadmin.d/20-admin.sh src/mtpadmin.d/21-admin-tail.sh src/mtpadmin.d/22-guard.sh src/mtpadmin.d/25-doctor-runtime.sh src/mtpadmin.d/29-guard-dispatch.sh src/mtpadmin.d/30-menu.sh > /tmp/mtpadmin
          python3 scripts/normalize_cli.py /tmp/mtpadmin
          cat src/stats_collector.d/00-core.py src/stats_collector.d/10-runtime.py > /tmp/stats_collector.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stats_collector.py'); s=p.read_text(); m="if __name__=='__main__': raise SystemExit(main() or 0)"
          e=Path('src/stats_collector.d/15-online-history.py').read_text(); assert s.count(m)==1
          p.write_text(s.replace(m,e.rstrip()+'\n\n'+m,1))
          PY
          cat web/mtpadmin_web.d/00-core.py web/mtpadmin_web.d/10-ui.py web/mtpadmin_web.d/20-pages.py web/mtpadmin_web.d/30-actions.py > /tmp/mtpadmin_web.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/mtpadmin_web.py'); s=p.read_text(); m="if __name__=='__main__': main()"; assert s.count(m)==1
          for f in ('35-world-map.py','36-analytics.py','37-analytics-plus.py','38-operations.py'):
              e=Path('web/mtpadmin_web.d/'+f).read_text(); s=s.replace(m,e.rstrip()+'\n\n'+m,1)
          p.write_text(s)
          PY

      - name: Syntax and final runtime
        run: |
          bash -n /tmp/mtpadmin
          bash -n install.sh
          bash -n update.sh
          bash -n web-install.sh
          bash -n scripts/webproxy_install.sh
          bash -n scripts/component_update.sh
          python3 -m py_compile /tmp/stats_collector.py /tmp/mtpadmin_web.py scripts/normalize_cli.py src/user_config.py src/scanner_guard.py scripts/update_check.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/mtpadmin').read_text()
          assert s.count('doctor_cmd(){')==1
          assert s.count('resources_cmd(){')==1
          assert s.count('security_cmd(){')==1
          assert 'Memory PSI healthy' in s and 'Scanner Guard service' in s and 'Web active slot' in s
          assert 'WEBPROXY_READY' in s and 'provisioning incomplete' in s
          assert 'Swap pressure acceptable' not in s
          assert Path('VERSION').read_text().strip()=='0.11.3'
          print('Final runtime PASS')
          PY

      - name: Operations Update Center UI
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('web','/tmp/mtpadmin_web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w._o_state=lambda:{'WEBPROXY_HOST':'webproxy.example.com','WEBPROXY_SOURCE':'WEB_PROXY','WEBPROXY_READY':'1','MTPADMIN_VERSION':'0.11.3'}
          w._o_webproxy_secret=lambda:'00112233445566778899aabbccddeeff'
          w._o_update_status=lambda:{'checked_at':1,'updates':2,'components':{
              'mtpadmin':{'current':'0.11.3','latest':'0.12.0','available':True},
              'telemt':{'current':'3.5.5','latest':'3.5.5','available':False},
              'webproxy':{'current':'a'*40,'latest':'b'*40,'available':True}}}
          w._o_component_status=lambda:{}
          w._o_service=lambda name: True; w._o_http_ok=lambda url: True
          assert w._o_webproxy_link()=='https://t.me/webproxy?server=webproxy.example.com&secret=00112233445566778899aabbccddeeff'
          html=w._o_update_center('csrf')
          assert 'Update Center' in html and 'Доступно обновление' in html and '/action/component-update' in html
          card=w._o_webproxy_card('csrf')
          assert "name='host'" in card and 'webproxy.example.com' in card and '/action/webproxy-host' in card
          page=w.page_template('T','body','tester','dashboard',refresh=10)
          assert 'Доступно обновлений: 2' in page and 'href="/operations"' in page
          print('Update Center UI PASS')
          PY

      - name: Update checker semantics and cache bypass
        run: |
          python3 - <<'PY'
          import base64, importlib.util
          s=importlib.util.spec_from_file_location('u','scripts/update_check.py'); u=importlib.util.module_from_spec(s); s.loader.exec_module(u)
          assert u.semver('v3.5.5')==(3,5,5)
          assert u.semver('0.11.3')>(0,11,2)
          u.get_json=lambda url:{'encoding':'base64','content':base64.b64encode(b'0.11.3\n').decode()}
          assert u.github_file_text('owner/repo','VERSION','main')=='0.11.3\n'
          text=open('scripts/update_check.py',encoding='utf-8').read()
          assert "cmdver(['/usr/local/bin/mtpadmin','version']) or st.get('MTPADMIN_VERSION')" in text
          assert '/contents/{path}?ref={ref}' in text
          assert 'Cache-Control' in text and 'no-cache' in text
          print('Update checker cache bypass PASS')
          PY

      - name: WEB Proxy partial source recovery
        run: |
          cat >/tmp/mtpadmin-partial.toml <<'EOF'
          [general]
          fast_mode = true

          [access.users]
          "DEIMOS" = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          "WEB_PROXY" = "00112233445566778899aabbccddeeff"

          [access.user_enabled]
          EOF
          found=$(MTPADMIN_WEBPROXY_PROBE_CONFIG=/tmp/mtpadmin-partial.toml MTPADMIN_WEBPROXY_PROBE_SOURCE=WEB_PROXY bash scripts/webproxy_install.sh)
          test "$found" = '1|00112233445566778899aabbccddeeff'
          missing=$(MTPADMIN_WEBPROXY_PROBE_CONFIG=/tmp/mtpadmin-partial.toml MTPADMIN_WEBPROXY_PROBE_SOURCE=NOT_THERE bash scripts/webproxy_install.sh)
          test "$missing" = '0|'
          grep -q 'уже существует — переиспользую без ротации secret' scripts/webproxy_install.sh
          echo 'Partial WEB_PROXY recovery PASS'

      - name: Go toolchain permission recovery
        run: |
          grep -q 'fix_go_toolchain_access' update.sh
          grep -q 'chmod -R a+rX' update.sh
          grep -q 'runuser -u tproxy -- "$gobin" version' update.sh
          grep -q 'без прав на запись' update.sh
          echo 'Go access recovery PASS'

      - name: Official WEB Proxy installer invariants
        run: |
          grep -q "PINNED_TPROXY_COMMIT='52a5feb7fac38f68da5afef9cedd9b3bfc8473ca'" scripts/webproxy_install.sh
          grep -q "TPROXY_REPO='https://github.com/telegramdesktop/tproxy-server.git'" scripts/webproxy_install.sh
          grep -q 'runuser -u tproxy' scripts/webproxy_install.sh
          grep -q 'TPROXY_COMMIT_OVERRIDE' scripts/webproxy_install.sh
          grep -q 'WEBPROXY_HOST_OVERRIDE' scripts/webproxy_install.sh
          grep -q "state_set WEBPROXY_READY '0'" scripts/webproxy_install.sh
          grep -q "state_set WEBPROXY_READY '1'" scripts/webproxy_install.sh
          grep -q '"backend":"127.0.0.1:$PORT"' scripts/webproxy_install.sh
          grep -q 'LoadCredential=profiles.json:/etc/tproxy-server/profiles.json' scripts/webproxy_install.sh
          grep -q '127.0.0.1:8081/readyz' scripts/webproxy_install.sh
          grep -q 'previous version' scripts/webproxy_install.sh || grep -q 'предыдущая версия' scripts/webproxy_install.sh
          if grep -qE 'install-mtproxy|mtproto-proxy|-H 2398' scripts/webproxy_install.sh; then echo 'Second MTProxy backend must not be installed'; exit 1; fi

      - name: Build pinned official WEB relay and validate profile
        run: |
          rm -rf /tmp/tproxy-upstream
          git init -q /tmp/tproxy-upstream
          git -C /tmp/tproxy-upstream remote add origin https://github.com/telegramdesktop/tproxy-server.git
          git -C /tmp/tproxy-upstream fetch -q --depth=1 origin 52a5feb7fac38f68da5afef9cedd9b3bfc8473ca
          git -C /tmp/tproxy-upstream checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/tproxy-upstream rev-parse HEAD)" = 52a5feb7fac38f68da5afef9cedd9b3bfc8473ca
          (cd /tmp/tproxy-upstream && go test ./... && go build -trimpath -o /tmp/tproxy-server ./cmd/tproxy-server)
          mkdir -p /tmp/tproxy-site; printf '<!doctype html><title>ci</title>\n' >/tmp/tproxy-site/index.html
          printf '%s\n' '{"public_hostname":"webproxy.example.com","listen":"127.0.0.1:18080","admin_listen":"127.0.0.1:18081","public_dir":"/tmp/tproxy-site","profiles_file":"/tmp/tproxy-profiles.json"}' >/tmp/tproxy-config.json
          printf '%s\n' '{"profiles":[{"name":"WEB_PROXY","secret":"00112233445566778899aabbccddeeff","backend":"127.0.0.1:8443","carrier_mode":"https"}]}' >/tmp/tproxy-profiles.json
          chmod 600 /tmp/tproxy-profiles.json
          /tmp/tproxy-server -config /tmp/tproxy-config.json -profiles-file /tmp/tproxy-profiles.json -check

      - name: Component updater safety
        run: |
          grep -q 'telemt-before-' scripts/component_update.sh
          grep -q 'Checksum нового TeleMT' scripts/component_update.sh
          grep -q 'wait_telemt' scripts/component_update.sh
          grep -q 'systemd-run' scripts/component_update.sh
          grep -q 'TPROXY_COMMIT_OVERRIDE' scripts/component_update.sh
          grep -q 'WEBPROXY_HOST_OVERRIDE' scripts/component_update.sh

      - name: Seamless updater transformation
        run: |
          grep -q "VERSION='0.11.3'" update.sh
          grep -q '38-operations.py' update.sh
          grep -q 'update_check.py' update.sh
          grep -q 'component_update.sh' update.sh
          grep -q 'mtpadmin-update-check.timer' update.sh
          MTPADMIN_BOOTSTRAP_TEST=2 bash update.sh

      - name: README product page
        run: |
          grep -q 'Telegram MTProto Proxy, которым удобно управлять' README.md
          grep -q 'Telegram WEB Proxy' README.md
          grep -q 'Update Center' README.md

      - name: Guard against production secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude='ci.yml' '(ee6d61782e727525f37068b87cdc897d|bbd76513a94903a1545f655f8c3625bb|64\.188\.62\.153)' .; then
            echo 'Production value detected in repository'; exit 1
          fi
