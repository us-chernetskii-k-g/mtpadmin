name: MTPADMIN CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble runtime
        run: |
          set -euo pipefail
          cat src/mtpadmin.d/00-core.sh src/mtpadmin.d/10-sources.sh src/mtpadmin.d/11-source-stability.sh src/mtpadmin.d/20-admin.sh src/mtpadmin.d/21-admin-tail.sh src/mtpadmin.d/22-guard.sh src/mtpadmin.d/25-doctor-runtime.sh src/mtpadmin.d/29-guard-dispatch.sh src/mtpadmin.d/30-menu.sh > /tmp/mtpadmin
          python3 scripts/normalize_cli.py /tmp/mtpadmin
          cat src/stats_collector.d/00-core.py src/stats_collector.d/10-runtime.py > /tmp/stats.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stats.py'); s=p.read_text(); m="if __name__=='__main__': raise SystemExit(main() or 0)"
          e=Path('src/stats_collector.d/15-online-history.py').read_text(); assert s.count(m)==1
          p.write_text(s.replace(m,e.rstrip()+'\n\n'+m,1))
          p=Path('/tmp/web.py'); s=''.join(Path('web/mtpadmin_web.d/'+x).read_text() for x in ('00-core.py','10-ui.py','20-pages.py','30-actions.py'))
          m="if __name__=='__main__': main()"; assert s.count(m)==1
          for x in ('35-world-map.py','36-analytics.py','37-analytics-plus.py','38-operations.py','39-compact-ui.py','40-async-update-ui.py','41-webproxy-links-ui.py','42-stability.py','43-db-safety.py','44-webproxy-activity.py','45-ui-loop-fix.py','46-pwa.py'):
              e=Path('web/mtpadmin_web.d/'+x).read_text(); s=s.replace(m,e.rstrip()+'\n\n'+m,1)
          p.write_text(s)
          PY

      - name: Version syntax and release pinning
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.12.2'
          grep -q "VERSION='0.12.2'" update.sh
          grep -q "VERSION='0.12.2'" install.sh
          grep -q "VERSION='0.12.2'" web-install.sh
          grep -q "BASE_0120_COMMIT='6e6a7593b60452c1883e72269a340e97d088c0f3'" update.sh
          grep -q 'RELEASE_REF=${MTPADMIN_RELEASE_REF:-main}' update.sh
          bash -n /tmp/mtpadmin update.sh install.sh web-install.sh
          bash -n scripts/webproxy_install.sh scripts/webproxy_backend_install.sh scripts/webproxy_telemetry_install.sh scripts/component_update.sh scripts/scanner_watchdog.sh
          python3 -m py_compile /tmp/web.py /tmp/stats.py src/user_config.py src/scanner_guard.py scripts/update_check.py

      - name: Clean install wizard contract
        run: |
          set -euo pipefail
          grep -q 'MTPADMIN · ПЕРВОНАЧАЛЬНАЯ УСТАНОВКА' install.sh
          grep -q "ask 'Домен обычного MTProto Proxy'" install.sh
          grep -q "ask 'Домен веб-админки'" install.sh
          grep -q 'Повторите пароль веб-админки' install.sh
          grep -q "ask 'Домен Telegram WEB Proxy'" install.sh
          grep -q 'Начать установку с этими параметрами' install.sh
          grep -q "предупреждения DNS?' 'N'" install.sh
          grep -q "VERSION='0.12.2'" web-install.sh
          ! grep -q 'echo.*WEB_PASS' install.sh

      - name: Browser UI and PWA regression
        run: |
          python3 - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w.VERSION='0.12.2'
          w.state=lambda:{'PROFILE':'MAIN','WEBPROXY_SOURCE':'WEB_PROXY','WEBPROXY_HOST':'webproxy.example.com','WEBPROXY_READY':'1','MTPADMIN_VERSION':'0.12.2'}
          w.query=lambda *a,**kw:[]; w.scalar=lambda *a,**kw:0
          w._o_service=lambda *a:True; w._o_http_ok=lambda *a:True
          w._o_health=lambda:(100,[['TeleMT','<span class="ok">PASS</span>']])
          w._o_update_status=lambda:{'components':{k:{'current':'1','latest':'1','available':False} for k in ('mtpadmin','telemt','webproxy')},'checked_at':1,'updates':0}
          w._o_component_status=lambda:{}; w._o_backups=lambda:'backup'; w._o_learning=lambda:'guard'; w._o_webproxy_link=lambda:''; w._o_qr=lambda x:''
          w.source_rows=lambda:[{'username':'MAIN','enabled':True,'current_connections':4,'active_unique_ips':2,'total_octets':100}]
          html=w.page_template('Обзор',w.dashboard_html(),'admin','dashboard')
          dangerous='new MutationObserver(enhance).observe(document.documentElement,{childList:true,subtree:true});'
          assert 'mtpadmin-client-ui' in html and 'Сервис работает стабильно' in html
          assert 'self-triggering MutationObserver disabled' in html and dangerous not in html
          assert 'rel="manifest" href="/manifest.webmanifest"' in html
          assert 'id="m-pwa-sheet"' in html and 'Установить приложение' in html and 'Продолжить в браузере' in html
          assert "navigator.serviceWorker.register('/mtpadmin-sw.js'" in html
          manifest=json.loads(w._PWA_MANIFEST.decode())
          assert manifest['name']=='MTPADMIN' and manifest['display']=='standalone' and manifest['scope']=='/'
          assert {x['sizes'] for x in manifest['icons']} >= {'192x192','512x512'}
          sw=w._PWA_SW.decode()
          assert 'event.respondWith(fetch(event.request))' in sw
          assert 'caches.open' not in sw and 'caches.match' not in sw and 'CacheStorage' not in sw
          assert w._pwa_icon_png(192).startswith(b'\x89PNG\r\n\x1a\n')
          assert w._pwa_icon_png(512).startswith(b'\x89PNG\r\n\x1a\n')
          ops=w.page_template('Операции',w._o_operations_html('admin','csrf'),'admin','operations')
          assert 'Управление сервисом' in ops and dangerous not in ops and 'manifest.webmanifest' in ops
          print('Browser UI + PWA regression PASS')
          PY

      - name: WEB client route and source runtime safety
        run: |
          set -euo pipefail
          MTPADMIN_WEBPROXY_PROBE_RUNTIME_JSON='{"data":[{"username":"WEB_PROXY","in_runtime":true}]}' MTPADMIN_WEBPROXY_PROBE_SOURCE=WEB_PROXY bash scripts/webproxy_install.sh
          if MTPADMIN_WEBPROXY_PROBE_RUNTIME_JSON='{"data":[{"username":"WEB_PROXY","in_runtime":false}]}' MTPADMIN_WEBPROXY_PROBE_SOURCE=WEB_PROXY bash scripts/webproxy_install.sh; then exit 1; fi
          grep -q 'x.get("in_runtime") is True' scripts/webproxy_install.sh
          grep -q 'WEB_IDENTITY_BEFORE' update.sh
          grep -q 'Telemetry видит активный WEB IP, но /active его не отображает' update.sh
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w.state=lambda:{'PROFILE':'DEIMOS','WEBPROXY_SOURCE':'WEB_PROXY'}
          w._wpa_source_rows=lambda:[{'username':'DEIMOS','current_connections':4,'active_unique_ips':1},{'username':'WEB_PROXY','current_connections':0,'active_unique_ips':0}]
          w._wpa_metrics=lambda:{'tproxy_sessions_live':3,'tproxy_streams_live':8}; w._wpa_clients=lambda:[{'ip':'198.51.100.10','sessions':2},{'ip':'2001:db8::10','sessions':1}]
          w.api_json=lambda p,**k:[{'username':'DEIMOS','active_ips':['203.0.113.7']}] if p=='/v1/stats/users/active-ips' else []; w.query=lambda *a,**k:[]
          html=w.active_clients_html(); assert '198.51.100.10' in html and '2001:db8::10' in html and 'WEB потоки' in html
          shell=w.page_template('Активные',html,'admin','active'); assert 'new MutationObserver(enhance).observe' not in shell
          print('WEB client route PASS')
          PY

      - name: Production safety contracts
        run: |
          set -euo pipefail
          grep -q 'BUILD_ROOT=${MTPADMIN_TPROXY_BUILD_ROOT:-/var/tmp/mtpadmin-build}' scripts/webproxy_telemetry_install.sh
          grep -q 'install -d -m 0711 -o root -g root "$BUILD_ROOT"' scripts/webproxy_telemetry_install.sh
          grep -q 'runuser -u tproxy -- test -x "$BUILD_ROOT"' scripts/webproxy_telemetry_install.sh
          grep -q 'restore_patched_backup' scripts/webproxy_telemetry_install.sh
          grep -q '"max_pending_items_per_session": 16384' scripts/webproxy_install.sh
          grep -q 'post-update validation/repair' scripts/component_update.sh
          grep -q "web/mtpadmin_web.d/46-pwa.py" update.sh
          grep -q 'Мобильное приложение не должно кэшировать данные админки' update.sh

      - name: Compile patched upstream tproxy-server
        run: |
          set -euo pipefail
          rm -rf /tmp/tproxy-upstream
          git init -q /tmp/tproxy-upstream
          git -C /tmp/tproxy-upstream remote add origin https://github.com/telegramdesktop/tproxy-server.git
          git -C /tmp/tproxy-upstream fetch -q --depth=1 origin 52a5feb7fac38f68da5afef9cedd9b3bfc8473ca
          git -C /tmp/tproxy-upstream checkout -q --detach FETCH_HEAD
          MTPADMIN_TPROXY_TELEMETRY_PATCH_SOURCE=/tmp/tproxy-upstream bash scripts/webproxy_telemetry_install.sh
          (cd /tmp/tproxy-upstream && go test ./... && go build -trimpath -o /tmp/tproxy-server ./cmd/tproxy-server)

      - name: Seamless updater transformation
        run: |
          set -euo pipefail
          MTPADMIN_BOOTSTRAP_TEST=2 bash update.sh

      - name: Public README and secret scan
        run: |
          set -euo pipefail
          grep -q 'свой Telegram Proxy с веб' README.md
          grep -q 'Новый Telegram WEB Proxy' README.md
          grep -q 'https://t.me/boss_of_this_vpn' README.md
          python3 - <<'PY'
          import pathlib,re
          allowed={'00112233445566778899aabbccddeeff','ffeeddccbbaa99887766554433221100','11111111111111111111111111111111','22222222222222222222222222222222','33333333333333333333333333333333'}
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.zip','.gz','.db'}: continue
              try:s=p.read_text(errors='ignore')
              except Exception:continue
              for m in re.finditer(r'(?i)(?:secret|password|token)\s*[=:]\s*["\x27]?([0-9a-f]{32,}|[A-Za-z0-9_-]{40,})',s):
                  if m.group(1).lower() not in allowed: bad.append((str(p),m.group(1)[:12]))
          assert not bad,bad
          print('Secret scan PASS')
          PY