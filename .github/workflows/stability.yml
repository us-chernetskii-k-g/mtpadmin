name: MTPADMIN Stability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble audited runtime
        run: |
          set -euo pipefail
          cat src/mtpadmin.d/00-core.sh src/mtpadmin.d/10-sources.sh src/mtpadmin.d/11-source-stability.sh src/mtpadmin.d/20-admin.sh src/mtpadmin.d/21-admin-tail.sh src/mtpadmin.d/22-guard.sh src/mtpadmin.d/25-doctor-runtime.sh src/mtpadmin.d/29-guard-dispatch.sh src/mtpadmin.d/30-menu.sh > /tmp/mtpadmin
          python3 scripts/normalize_cli.py /tmp/mtpadmin
          cat src/stats_collector.d/00-core.py src/stats_collector.d/10-runtime.py > /tmp/stats.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stats.py'); s=p.read_text(); m="if __name__=='__main__': raise SystemExit(main() or 0)"
          e=Path('src/stats_collector.d/15-online-history.py').read_text(); assert s.count(m)==1
          p.write_text(s.replace(m,e.rstrip()+'\n\n'+m,1))
          p=Path('/tmp/web.py'); s=''.join(Path('web/mtpadmin_web.d/'+x).read_text() for x in ('00-core.py','10-ui.py','20-pages.py','30-actions.py'))
          m="if __name__=='__main__': main()"; assert s.count(m)==1
          for x in ('35-world-map.py','36-analytics.py','37-analytics-plus.py','38-operations.py','39-compact-ui.py','40-async-update-ui.py','41-webproxy-links-ui.py','42-stability.py','43-db-safety.py','44-webproxy-activity.py'):
              e=Path('web/mtpadmin_web.d/'+x).read_text(); s=s.replace(m,e.rstrip()+'\n\n'+m,1)
          p.write_text(s)
          PY

      - name: Syntax and release contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.11.14'
          grep -q "VERSION='0.11.14'" install.sh
          grep -q "VERSION='0.11.14'" update.sh
          grep -q "VERSION='0.11.14'" web-install.sh
          grep -q 'MTPADMIN CLEAN INSTALL' install.sh
          grep -q 'Повторите пароль веб-админки' install.sh
          grep -q 'Начать установку с этими параметрами' install.sh
          grep -q "BUILD_ROOT='/var/tmp/mtpadmin-build'" install.sh
          grep -q 'install -d -m 0711 -o root -g root "$BUILD_ROOT"' install.sh
          grep -q 'BUILD_ROOT=${MTPADMIN_TPROXY_BUILD_ROOT:-/var/tmp/mtpadmin-build}' scripts/webproxy_telemetry_install.sh
          grep -q 'install -d -m 0711 -o root -g root "$BUILD_ROOT"' scripts/webproxy_telemetry_install.sh
          grep -q 'runuser -u tproxy -- test -x "$BUILD_ROOT"' scripts/webproxy_telemetry_install.sh
          grep -q 'post-update validation/repair' scripts/component_update.sh
          bash -n /tmp/mtpadmin
          bash -n install.sh
          bash -n update.sh
          bash -n web-install.sh
          bash -n scripts/webproxy_install.sh
          bash -n scripts/webproxy_backend_install.sh
          bash -n scripts/webproxy_telemetry_install.sh
          bash -n scripts/component_update.sh
          bash -n scripts/scanner_watchdog.sh
          python3 -m py_compile /tmp/web.py /tmp/stats.py src/user_config.py src/scanner_guard.py scripts/update_check.py

      - name: SQLite FD regression
        run: |
          python3 - <<'PY'
          import importlib.util,os,sqlite3,tempfile
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          fd,path=tempfile.mkstemp(); os.close(fd)
          c=sqlite3.connect(path); c.execute('create table t(x integer)'); c.execute('insert into t values(1)'); c.commit(); c.close(); w.DB=path
          before=len(os.listdir('/proc/self/fd'))
          for _ in range(500): assert w.scalar('select x from t')==1
          after=len(os.listdir('/proc/self/fd')); assert after-before<=3,(before,after)
          print('FD regression PASS',before,after)
          PY

      - name: Source lifecycle and TOML array boundary
        run: |
          python3 - <<'PY'
          import importlib.util,tempfile,tomllib
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('u','src/user_config.py'); u=importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          p=Path(tempfile.mktemp(suffix='.toml')); p.write_text('[access.users]\n"DEMO"="00112233445566778899aabbccddeeff"\n\n[[upstreams]]\ntype="direct"\nenabled=true\nweight=10\n')
          u.CFG=p
          class A: pass
          a=A(); a.name='DEMO'; a.ad_tag='ffeeddccbbaa99887766554433221100'; a.max_conns='123'; a.max_ips='7'; u.edit(a)
          a.ad_tag='none'; a.max_conns='none'; a.max_ips='none'; u.edit(a)
          b=A(); b.name='AD_01'; b.secret='11'*16; b.ad_tag=None; b.max_conns=None; b.max_ips=None; u.add(b)
          with open(p,'rb') as f:d=tomllib.load(f)
          assert d['access']['users']['AD_01']==b.secret and 'AD_01' not in d['upstreams'][0]
          p.write_text('[access.users]\n"MAIN"="00112233445566778899aabbccddeeff"\n\n[[upstreams]]\ntype="direct"\n"WEB_PROXY"="22222222222222222222222222222222"\n')
          u.CFG=p; u.repair_misplaced(A())
          with open(p,'rb') as f:d=tomllib.load(f)
          assert d['access']['users']['WEB_PROXY']=='22222222222222222222222222222222' and 'WEB_PROXY' not in d['upstreams'][0]
          print('Source/TOML regression PASS')
          PY

      - name: Update Center route isolation
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w._o_update_status=lambda:{'components':{k:{'current':'1','latest':'2','available':True} for k in ('mtpadmin','telemt','webproxy')},'checked_at':1,'updates':3}; w._o_component_status=lambda:{}
          html=w._o_update_center('csrf'); assert "name='component'" not in html
          for c in ('mtpadmin','telemt','webproxy'): assert f"action='/action/component-update/{c}'" in html
          calls=[]; w.csrf_ok=lambda *a:True; w.run=lambda args,timeout=10:(calls.append(list(args)) or (0,'job'))
          class F:
              def require_user(self): return True
              def user(self): return 'admin'
              def form(self): return {'csrf':'x'}
              def redirect(self,*a,**k): pass
              def send_html(self,*a,**k): self.sent=(a,k)
          for c in ('mtpadmin','telemt','webproxy'):
              f=F(); f.path='/action/component-update/'+c; w._au_do_POST(f); assert calls[-1][-1]==c
          print('Update route isolation PASS')
          PY

      - name: WEB IPv4 IPv6 live merge and history
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w.state=lambda:{'PROFILE':'A','WEBPROXY_SOURCE':'WEB_PROXY'}
          w._wpa_source_rows=lambda:[{'username':'A','current_connections':4,'active_unique_ips':1},{'username':'WEB_PROXY','current_connections':0,'active_unique_ips':0}]
          w._wpa_metrics=lambda:{'tproxy_sessions_live':3,'tproxy_streams_live':8}; w._wpa_clients=lambda:[{'ip':'198.51.100.10','sessions':2},{'ip':'2001:db8::10','sessions':1}]
          w.api_json=lambda p,**k:[{'username':'A','active_ips':['203.0.113.7']}] if p=='/v1/stats/users/active-ips' else []; w.query=lambda *a,**k:[]
          rows={x['username']:x for x in w.source_rows()}; assert rows['WEB_PROXY']['current_connections']==3 and rows['WEB_PROXY']['active_unique_ips']==2
          html=w.active_clients_html(); assert '198.51.100.10' in html and '2001:db8::10' in html and '● WEB' in html
          spec=importlib.util.spec_from_file_location('s','/tmp/stats.py'); s=importlib.util.module_from_spec(spec); spec.loader.exec_module(s)
          s.state=lambda:{'WEBPROXY_SOURCE':'WEB_PROXY'}; s._base_active_pairs=lambda:{('A','203.0.113.7')}; s._tproxy_client_rows=lambda:[{'ip':'198.51.100.10','sessions':2},{'ip':'2001:db8::10','sessions':1}]
          active=s.active_pairs(); assert ('WEB_PROXY','198.51.100.10') in active and ('WEB_PROXY','2001:db8::10') in active
          print('WEB mixed-IP regression PASS')
          PY

      - name: Production safety contracts
        run: |
          set -euo pipefail
          grep -q 'source_apply_or_restart' src/mtpadmin.d/11-source-stability.sh
          grep -q '"max_pending_items_per_session": 16384' scripts/webproxy_install.sh
          grep -q 'chmod 0711 "$TMP"' scripts/webproxy_backend_install.sh
          grep -q 'chmod 0755 "$build/objs/bin/mtproto-proxy"' scripts/webproxy_backend_install.sh
          grep -q 'restore_patched_backup' scripts/webproxy_telemetry_install.sh
          grep -q 'GOTMPDIR="$gotmp"' scripts/webproxy_telemetry_install.sh
          grep -q 'MAX_AGE=.*120' scripts/scanner_watchdog.sh
          grep -q 'systemctl restart "$SCANNER"' scripts/scanner_watchdog.sh

      - name: Public product and support contract
        run: |
          set -euo pipefail
          grep -q 'свой Telegram Proxy с веб' README.md
          grep -q 'Новый Telegram WEB Proxy' README.md
          grep -q 'https://t.me/boss_of_this_vpn' README.md
          grep -q 'https://yookassa.ru/my/i/aoLKJEpmtnnX/l' README.md
          grep -q '\*\*0.11.14\*\*' README.md

      - name: Guard against accidental production secrets
        run: |
          python3 - <<'PY'
          import pathlib,re
          allowed={'00112233445566778899aabbccddeeff','ffeeddccbbaa99887766554433221100','11111111111111111111111111111111','22222222222222222222222222222222','33333333333333333333333333333333'}
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.zip','.gz','.db'}: continue
              try:s=p.read_text(errors='ignore')
              except Exception:continue
              for m in re.finditer(r'(?i)(?:secret|password|token)\s*[=:]\s*["\x27]?([0-9a-f]{32,}|[A-Za-z0-9_-]{40,})',s):
                  v=m.group(1)
                  if v.lower() not in allowed: bad.append((str(p),v[:12]))
          assert not bad,bad
          print('Secret scan PASS')
          PY
