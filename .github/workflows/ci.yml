name: MTPADMIN CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble runtime
        run: |
          set -euo pipefail
          cat src/mtpadmin.d/00-core.sh src/mtpadmin.d/10-sources.sh src/mtpadmin.d/11-source-stability.sh src/mtpadmin.d/20-admin.sh src/mtpadmin.d/21-admin-tail.sh src/mtpadmin.d/22-guard.sh src/mtpadmin.d/25-doctor-runtime.sh src/mtpadmin.d/29-guard-dispatch.sh src/mtpadmin.d/30-menu.sh > /tmp/mtpadmin
          python3 scripts/normalize_cli.py /tmp/mtpadmin
          cat src/stats_collector.d/00-core.py src/stats_collector.d/10-runtime.py > /tmp/stats.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stats.py'); s=p.read_text(); m="if __name__=='__main__': raise SystemExit(main() or 0)"
          e=Path('src/stats_collector.d/15-online-history.py').read_text(); assert s.count(m)==1
          p.write_text(s.replace(m,e.rstrip()+'\n\n'+m,1))
          p=Path('/tmp/web.py'); s=''.join(Path('web/mtpadmin_web.d/'+x).read_text() for x in ('00-core.py','10-ui.py','20-pages.py','30-actions.py'))
          m="if __name__=='__main__': main()"; assert s.count(m)==1
          for x in ('35-world-map.py','36-analytics.py','37-analytics-plus.py','38-operations.py','39-compact-ui.py','40-async-update-ui.py','41-webproxy-links-ui.py','42-stability.py','43-db-safety.py','44-webproxy-activity.py'):
              e=Path('web/mtpadmin_web.d/'+x).read_text(); s=s.replace(m,e.rstrip()+'\n\n'+m,1)
          p.write_text(s)
          PY

      - name: Version, syntax and release pinning
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.11.14'
          grep -q "VERSION='0.11.14'" install.sh
          grep -q "VERSION='0.11.14'" update.sh
          grep -q "VERSION='0.11.14'" web-install.sh
          grep -q "BASE_01112_COMMIT='6b56d501c12dd7f13d1d21b76a320a5973336777'" update.sh
          grep -q 'RELEASE_REF=${MTPADMIN_RELEASE_REF:-main}' install.sh
          grep -q 'RELEASE_REF=${MTPADMIN_RELEASE_REF:-main}' update.sh
          grep -q 'RELEASE_REF=${MTPADMIN_RELEASE_REF:-main}' web-install.sh
          bash -n /tmp/mtpadmin
          bash -n install.sh
          bash -n update.sh
          bash -n web-install.sh
          bash -n scripts/webproxy_install.sh
          bash -n scripts/webproxy_backend_install.sh
          bash -n scripts/webproxy_telemetry_install.sh
          bash -n scripts/component_update.sh
          bash -n scripts/scanner_watchdog.sh
          python3 -m py_compile /tmp/web.py /tmp/stats.py src/user_config.py src/scanner_guard.py scripts/update_check.py

      - name: Clean install wizard contract
        run: |
          set -euo pipefail
          grep -q 'MTPADMIN CLEAN INSTALL' install.sh
          grep -q 'До подтверждения система не изменяется' install.sh
          grep -q "ask 'Домен обычного MTProto Proxy'" install.sh
          grep -q "ask 'Домен веб-админки'" install.sh
          grep -q "ask 'Логин администратора'" install.sh
          grep -q "Пароль веб-админки (минимум 10 символов)" install.sh
          grep -q 'Повторите пароль веб-админки' install.sh
          grep -q "ask 'Домен Telegram WEB Proxy'" install.sh
          grep -q 'Начать установку с этими параметрами' install.sh
          grep -q "BUILD_ROOT='/var/tmp/mtpadmin-build'" install.sh
          grep -q 'install -d -m 0711 -o root -g root "$BUILD_ROOT"' install.sh
          grep -q 'MTPADMIN_RELEASE_REF="$RELEASE_REF"' install.sh
          grep -q 'MTPADMIN_WEB_PASSWORD="$WEB_PASS"' install.sh
          ! grep -q 'echo.*WEB_PASS' install.sh

      - name: Update Center route isolation regression
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w._o_update_status=lambda:{'components':{k:{'current':'1','latest':'2','available':k=='mtpadmin'} for k in ('mtpadmin','telemt','webproxy')},'checked_at':1,'updates':1}
          w._o_component_status=lambda:{}
          html=w._o_update_center('csrf')
          assert "name='component'" not in html
          for comp in ('mtpadmin','telemt','webproxy'):
              assert f"action='/action/component-update/{comp}'" in html
          doc=w.page_template('x','<form><input type="hidden" name="name" value="A"><input name="q" value="x"></form>','admin')
          assert 'input:not([type=hidden])' in doc
          assert "root.querySelectorAll('input,select,textarea')" not in doc
          calls=[]; responses=[]
          w.csrf_ok=lambda *a: True
          w.run=lambda args,timeout=10:(calls.append(list(args)) or (0,'job'))
          class F:
              def require_user(self): return True
              def user(self): return 'admin'
              def form(self): return {'csrf':'x'}
              def redirect(self,*a,**k): pass
              def send_html(self,*a,**k): responses.append((a,k))
          for comp in ('mtpadmin','telemt','webproxy'):
              f=F(); f.path='/action/component-update/'+comp; w._au_do_POST(f); assert calls[-1][-1]==comp
          n=len(calls); f=F(); f.path='/action/component-update'; w._au_do_POST(f)
          assert len(calls)==n and responses[-1][0][3]==409
          print('Update Center routing PASS')
          PY

      - name: WEB client UI and collector contract
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('w','/tmp/web.py'); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          w.state=lambda:{'PROFILE':'DEIMOS','WEBPROXY_SOURCE':'WEB_PROXY'}
          w._wpa_source_rows=lambda:[{'username':'DEIMOS','current_connections':4,'active_unique_ips':1},{'username':'WEB_PROXY','current_connections':0,'active_unique_ips':0}]
          w._wpa_metrics=lambda:{'tproxy_sessions_live':3,'tproxy_streams_live':8,'tproxy_streams_opened_total':24,'tproxy_bytes_up_total':100,'tproxy_bytes_down_total':200,'tproxy_backend_dial_failures_total':0,'tproxy_limit_hits_total':0}
          w._wpa_clients=lambda:[{'ip':'198.51.100.10','sessions':2},{'ip':'2001:db8::10','sessions':1}]
          w.api_json=lambda path,**kw:[{'username':'DEIMOS','active_ips':['203.0.113.7']}] if path=='/v1/stats/users/active-ips' else []
          w.query=lambda *a,**kw:[]
          rows={r['username']:r for r in w.source_rows()}
          assert rows['WEB_PROXY']['current_connections']==3 and rows['WEB_PROXY']['active_unique_ips']==2
          html=w.active_clients_html(); assert '198.51.100.10' in html and '2001:db8::10' in html and '● WEB' in html
          spec=importlib.util.spec_from_file_location('s','/tmp/stats.py'); s=importlib.util.module_from_spec(spec); spec.loader.exec_module(s)
          s.state=lambda:{'WEBPROXY_SOURCE':'WEB_PROXY'}; s._base_active_pairs=lambda:{('DEIMOS','203.0.113.7')}; s._tproxy_client_rows=lambda:[{'ip':'198.51.100.10','sessions':2},{'ip':'2001:db8::10','sessions':1}]
          assert ('WEB_PROXY','198.51.100.10') in s.active_pairs()
          print('WEB UI/collector PASS')
          PY

      - name: Disk-backed telemetry contract
        run: |
          set -euo pipefail
          grep -q 'BUILD_ROOT=${MTPADMIN_TPROXY_BUILD_ROOT:-/var/tmp/mtpadmin-build}' scripts/webproxy_telemetry_install.sh
          grep -q 'install -d -m 0711 -o root -g root "$BUILD_ROOT"' scripts/webproxy_telemetry_install.sh
          grep -q 'chmod 0711 "$BUILD_ROOT"' scripts/webproxy_telemetry_install.sh
          grep -q 'mktemp -d "$BUILD_ROOT/telemetry.' scripts/webproxy_telemetry_install.sh
          grep -q 'chmod 0711 "$TMP"' scripts/webproxy_telemetry_install.sh
          grep -q 'runuser -u tproxy -- test -x "$BUILD_ROOT"' scripts/webproxy_telemetry_install.sh
          grep -q 'runuser -u tproxy -- test -x "$TMP"' scripts/webproxy_telemetry_install.sh
          grep -q 'GOTMPDIR="$gotmp"' scripts/webproxy_telemetry_install.sh
          grep -q 'GOCACHE="$buildhome/gocache"' scripts/webproxy_telemetry_install.sh
          grep -q 'GOMODCACHE="$buildhome/gomod"' scripts/webproxy_telemetry_install.sh
          grep -q 'restore_patched_backup' scripts/webproxy_telemetry_install.sh
          grep -q 'MIN_BUILD_FREE_KB' scripts/webproxy_telemetry_install.sh
          grep -q 'post-update validation/repair' scripts/component_update.sh
          grep -q 'max_pending_items_per_session": 16384' scripts/webproxy_install.sh

      - name: Unprivileged build-root traversal regression
        run: |
          set -euo pipefail
          root=/tmp/mtpadmin-build-perm-test
          sudo rm -rf "$root"
          sudo install -d -m 0711 -o root -g root "$root"
          work=$(sudo mktemp -d "$root/telemetry.XXXXXXXX")
          sudo chmod 0711 "$work"
          sudo install -d -m 0700 -o nobody -g nogroup "$work/buildhome"
          sudo -u nobody test -x "$root"
          sudo -u nobody test -x "$work"
          sudo -u nobody test -w "$work/buildhome"
          sudo rm -rf "$root"
          echo 'Unprivileged build-root traversal PASS'

      - name: Compile patched upstream tproxy-server
        run: |
          set -euo pipefail
          rm -rf /tmp/tproxy-upstream
          git init -q /tmp/tproxy-upstream
          git -C /tmp/tproxy-upstream remote add origin https://github.com/telegramdesktop/tproxy-server.git
          git -C /tmp/tproxy-upstream fetch -q --depth=1 origin 52a5feb7fac38f68da5afef9cedd9b3bfc8473ca
          git -C /tmp/tproxy-upstream checkout -q --detach FETCH_HEAD
          MTPADMIN_TPROXY_TELEMETRY_PATCH_SOURCE=/tmp/tproxy-upstream bash scripts/webproxy_telemetry_install.sh
          (cd /tmp/tproxy-upstream && go test ./... && go build -trimpath -o /tmp/tproxy-server ./cmd/tproxy-server)

      - name: Seamless updater transformation
        run: |
          set -euo pipefail
          MTPADMIN_BOOTSTRAP_TEST=2 bash update.sh

      - name: Public README contract
        run: |
          set -euo pipefail
          grep -q 'свой Telegram Proxy с веб' README.md
          grep -q 'Новый Telegram WEB Proxy' README.md
          grep -q 'Update Center' README.md
          grep -q 'curl -fsSL https://raw.githubusercontent.com/us-chernetskii-k-g/mtpadmin/main/install.sh' README.md
          grep -q 'https://t.me/boss_of_this_vpn' README.md
          grep -q 'https://yookassa.ru/my/i/aoLKJEpmtnnX/l' README.md
          grep -q '\*\*0.11.14\*\*' README.md

      - name: Guard against production secrets
        run: |
          python3 - <<'PY'
          import pathlib,re
          allowed={'00112233445566778899aabbccddeeff','ffeeddccbbaa99887766554433221100','11111111111111111111111111111111','22222222222222222222222222222222','33333333333333333333333333333333'}
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.zip','.gz','.db'}: continue
              try:s=p.read_text(errors='ignore')
              except Exception:continue
              for m in re.finditer(r'(?i)(?:secret|password|token)\s*[=:]\s*["\x27]?([0-9a-f]{32,}|[A-Za-z0-9_-]{40,})',s):
                  value=m.group(1)
                  if value.lower() not in allowed: bad.append((str(p),value[:12]))
          assert not bad,bad
          print('Secret scan PASS')
          PY
