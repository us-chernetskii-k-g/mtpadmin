name: Installer Interactive

on:
  push:
    paths:
      - install.sh
      - web-install.sh
      - update.sh
      - VERSION
      - .github/workflows/installer-interactive.yml
  pull_request:
    paths:
      - install.sh
      - web-install.sh
      - update.sh
      - VERSION
      - .github/workflows/installer-interactive.yml
  workflow_dispatch:

jobs:
  interactive-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Syntax version and prompt contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh web-install.sh update.sh
          test "$(cat VERSION)" = '0.12.5'
          grep -Fq "VERSION='0.12.5'" install.sh
          grep -Fq "VERSION='0.12.5'" web-install.sh
          grep -Fq "VERSION='0.12.5'" update.sh
          grep -Fq 'ask(){' install.sh
          grep -Fq 'ask_secret(){' install.sh
          grep -Fq 'normal_host_inplace(){' install.sh
          grep -Fq 'MTPADMIN_INSTALL_WIZARD_TEST' install.sh
          grep -Fq 'MTPADMIN_INSTALL_PREFLIGHT_TEST' install.sh
          grep -Fq -- '--retry-all-errors' install.sh
          grep -Fq -- '--retry-all-errors' web-install.sh
          grep -Fq 'download_shell' install.sh
          awk '/^info .*Проверяю установочные файлы до изменения системы/{exit} {print}' install.sh > /tmp/installer-wizard-active.sh
          if grep -Eq '\$\((ask|ask_secret)[[:space:]]' /tmp/installer-wizard-active.sh; then
            echo 'Interactive ask must never run inside command substitution.' >&2
            exit 1
          fi
          grep -Fq "ask 'Домен обычного MTProto Proxy' \"\$HOST_DEFAULT\" PUBLIC_HOST" /tmp/installer-wizard-active.sh
          grep -Fq "ask 'Домен веб-админки' \"\$WEB_DEFAULT\" WEB_HOST" /tmp/installer-wizard-active.sh
          grep -Fq "ask 'Домен Telegram WEB Proxy' \"\$WEBPROXY_DEFAULT\" WEBPROXY_HOST" /tmp/installer-wizard-active.sh

      - name: Downloaded-file style wizard
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/answers-file <<'EOF'
          HTTP://Proxy.Example.COM/
          203.0.113.10
          8443
          MAIN
          HTTPS://Google.COM/
          7
          400



          mtpadmin.example.com
          admin
          1234567890x
          1234567890x
          webproxy.example.com
          EOF
          script -qefc "sudo env MTPADMIN_RELEASE_REF=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa MTPADMIN_INSTALL_WIZARD_TEST=1 bash ./install.sh" /tmp/installer-file.log < /tmp/answers-file
          grep -Fq 'MTProto Proxy:          proxy.example.com:8443' /tmp/installer-file.log
          grep -Fq 'Веб-админка:            https://mtpadmin.example.com/' /tmp/installer-file.log
          grep -Fq 'Telegram WEB Proxy:     https://webproxy.example.com/' /tmp/installer-file.log
          grep -Fq 'Installer interactive wizard test PASS' /tmp/installer-file.log

      - name: Pipe-to-bash wizard
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/answers-pipe <<'EOF'
          proxy.example.com
          203.0.113.10
          8443
          MAIN
          google.com
          7
          400



          mtpadmin.example.com
          admin
          1234567890x
          1234567890x
          webproxy.example.com
          EOF
          script -qefc "cat ./install.sh | sudo env MTPADMIN_RELEASE_REF=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb MTPADMIN_INSTALL_WIZARD_TEST=1 bash" /tmp/installer-pipe.log < /tmp/answers-pipe
          grep -Fq 'MTProto Proxy:          proxy.example.com:8443' /tmp/installer-pipe.log
          grep -Fq 'Installer interactive wizard test PASS' /tmp/installer-pipe.log

      - name: Release-pinned payload preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'Y\nY\n' > /tmp/preflight-answers
          script -qefc "sudo env \
            MTPADMIN_RELEASE_REF=$GITHUB_SHA \
            MTP_PUBLIC_HOST=proxy.example.com \
            MTP_PUBLIC_IP=203.0.113.10 \
            MTP_PORT=8443 \
            MTP_PROFILE=MAIN \
            MTP_FAKE_TLS_DOMAIN=google.com \
            MTP_RETENTION_DAYS=7 \
            MTP_ANON_RETENTION_DAYS=400 \
            MTP_PROMOTED_CHANNEL= \
            MTP_RAW_SECRET=00112233445566778899aabbccddeeff \
            MTP_AD_TAG= \
            MTPADMIN_WEB_HOST=mtpadmin.example.com \
            MTPADMIN_WEB_USER=admin \
            MTPADMIN_WEB_PASSWORD=1234567890x \
            MTPADMIN_WEBPROXY_HOST=webproxy.example.com \
            MTPADMIN_INSTALL_PREFLIGHT_TEST=1 \
            bash ./install.sh" /tmp/installer-preflight.log < /tmp/preflight-answers
          grep -Fq 'Все основные установочные файлы скачаны и прошли проверку синтаксиса.' /tmp/installer-preflight.log
          grep -Fq 'Installer payload preflight test PASS' /tmp/installer-preflight.log
